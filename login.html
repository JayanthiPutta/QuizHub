<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>
  <script>
    function showSuccessMessage(event) {
      event.preventDefault();
      alert("Your login is successfully completed!");
      // Redirect to topic selection page
      window.location.href = "topicselection.html"; // Change the filename if your actual file is different
    }
  </script>
</head>
<body id="img" style="text-align:center;
  font-family:rockwell;
  color:#4B0082; 
  margin-top:100px;
  background-image:url('https://img.freepik.com/free-photo/cloud-paper-light-bulb_23-2148519485.jpg?t=st=1743949716~exp=1743953316~hmac=3dfcdfc9d00b36e0a17b4bd4a439db723fd1abca6e08a4e11348a07730bbcb07&w=1380');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  height:100vh;">

  <center>
    <marquee bgcolor="pink" direction="right" width="900" behaviour="alternate">
      <font face="copper plate gothic bold" size="7" color="indigo">LOGIN TO QUIZ HUB</font>
    </marquee>
  </center>

  <br><br>

  <form onsubmit="showSuccessMessage(event);">
    <label for="username" style="font-size:25px">Enter Username:</label>
    <input type="text" id="username" name="username" required><br><br>

    <label for="password" style="font-size:25px">Enter Password:</label>
    <input type="password" id="password" name="password" required><br><br>

    <input type="submit" value="Submit" style="background-color:green; color:white; font-size:25px">
    <input type="reset" value="Reset" style="background-color:gray; color:white; font-size:25px">
  </form>

  <br><br>

  <p style="font-size:25px;"><a href="homepage.html">Back to Home</a></p>
</body>
</html>
