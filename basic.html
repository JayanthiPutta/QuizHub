<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simple Quiz Test</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background:#222; color:#fff; }
  #question { font-size: 1.5em; margin-bottom: 20px; }
  .option-btn { 
    background: #444; color: #fff; border: none; 
    padding: 10px 20px; margin: 5px 0; width: 100%;
    cursor: pointer;
    font-size: 1em;
    border-radius: 5px;
  }
  .option-btn:hover { background: #666; }
</style>
</head>
<body>

<div id="question">Loading question...</div>
<div id="options"></div>

<script>
  const questions = [
    {
      question: "What is 2 + 2?",
      options: ["3", "4", "5", "6"],
      correctIndex: 1
    },
    {
      question: "Capital of India?",
      options: ["Delhi", "Mumbai", "Kolkata", "Chennai"],
      correctIndex: 0
    }
  ];

  let currentQuestion = 0;

  function loadQuestion() {
    const q = questions[currentQuestion];
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');

    questionEl.textContent = q.question;
    optionsEl.innerHTML = '';

    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.onclick = () => {
        alert(idx === q.correctIndex ? "Correct!" : "Wrong!");
      };
      optionsEl.appendChild(btn);
    });
  }

  window.onload = loadQuestion;
</script>

</body>
</html>
